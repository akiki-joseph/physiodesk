<div style="background:#edf1f7;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;color:#0f1b2d">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:20px;overflow:hidden">
    <div style="background:#0f1b2d;padding:24px 28px;border-bottom:5px solid #f2512f">
      <div style="color:#eef3ff;font-size:22px;font-weight:bold">PhysioDesk</div>
    </div>
    <div style="padding:28px">
      <h1 style="font-size:22px;margin:0 0 12px">Your sign-in code</h1>
      <p style="font-size:15px;line-height:1.5;margin:0 0 16px">Type this code in PhysioDesk to sign in. Then set a new password in Settings → Account.</p>
      <p style="font-size:34px;font-weight:bold;letter-spacing:8px;margin:0 0 20px;color:#2453e6">{{ .Token }}</p>
      <p style="font-size:13px;color:#596780;line-height:1.5;margin:0">The code works for one hour. If you didn't ask for it, you can ignore this email; your account stays safe.</p>
    </div>
  </div>
</div>
