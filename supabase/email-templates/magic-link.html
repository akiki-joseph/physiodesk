<div style="background:#f3f4f8;padding:32px 16px;font-family:Arial,Helvetica,sans-serif;color:#14151b">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:20px;overflow:hidden">
    <div style="background:#14151b;padding:24px 28px;border-bottom:5px solid #2ee6a6">
      <div style="color:#ffffff;font-size:22px;font-weight:bold">Junctura</div>
    </div>
    <div style="padding:28px">
      <h1 style="font-size:22px;margin:0 0 12px">Your sign-in code</h1>
      <p style="font-size:15px;line-height:1.5;margin:0 0 16px">Type this code in Junctura to sign in. Then set a new password in Settings → Account.</p>
      <p style="font-size:34px;font-weight:bold;letter-spacing:8px;margin:0 0 20px;color:#5b4bff">{{ .Token }}</p>
      <p style="font-size:13px;color:#5a5d70;line-height:1.5;margin:0">The code works for one hour. If you didn't ask for it, you can ignore this email; your account stays safe.</p>
    </div>
  </div>
</div>
