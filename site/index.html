<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Junctura</title>
<meta name="description" content="Junctura: appointments, clients, home exercises and income for physiotherapists.">
<meta name="theme-color" content="#14151b">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
@font-face{font-family:Unbounded;src:url(fonts/unbounded.woff2) format("woff2");font-weight:200 900;font-display:swap}
@font-face{font-family:Manrope;src:url(fonts/manrope.woff2) format("woff2");font-weight:200 800;font-display:swap}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#14151b;color:#f3f4f8;font-family:Manrope,system-ui,sans-serif;display:grid;place-items:center;padding:32px 16px;
  background-image:radial-gradient(80% 60% at 100% 0%,rgb(91 75 255/.45),transparent 62%),radial-gradient(60% 50% at 0% 100%,rgb(46 230 166/.14),transparent 60%)}
main{max-width:520px;text-align:center}
img{width:84px;height:84px;border-radius:22px;box-shadow:0 18px 50px rgb(91 75 255/.45)}
h1{font-family:Unbounded,sans-serif;font-size:34px;letter-spacing:-.02em;margin:22px 0 10px}
p{color:#a7a9bd;font-size:17px;line-height:1.55;margin:0}
</style>
</head>
<body>
<main>
<img src="icon.svg" alt="">
<h1>Junctura</h1>
<p>The practice app for physiotherapists: appointments, clients, treatment notes, home exercises and income, in one place.</p>
</main>
</body>
</html>
