name: Build PhysioDesk APK

on:
  push:
    branches: [ main ]
    # Editing only the README doesn't need a new APK.
    paths-ignore:
      - '**.md'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm install

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: App icon
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icons/$d.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp icons/$d.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
            cp icons/$d.png android/app/src/main/res/mipmap-$d/ic_launcher_foreground.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Splash screen
        run: |
          for f in splash/*.png; do
            n=$(basename "$f" .png)
            cp "$f" "android/app/src/main/res/$n/splash.png"
          done

      - name: Build number (shows as "build N" in the phone's app info)
        run: |
          sed -i -E 's/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName "[^"]*"/versionName "build ${{ github.run_number }}"/' android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle

      - name: Signing key (the same key on every build, so updates install over the old app and keep its data)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/app.keystore"
          elif [ -f keystore/debug.keystore ]; then
            cp keystore/debug.keystore "$RUNNER_TEMP/app.keystore"
          else
            echo "::error::No signing key. Put the keystore folder back, or add the KEYSTORE_BASE64 secret (see README)."
            exit 1
          fi

      - name: Build the APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/app.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
          cp app/build/outputs/apk/release/app-release.apk ../PhysioDesk.apk

      - name: Check the APK (right key, right build number, not a debug build)
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BT/apksigner" verify --print-certs PhysioDesk.apk | tee signer.txt
          grep -q "SHA-256 digest: 45fd01b3856bbdab1a5ee75b9f862ed4bb29690d912f3c9fc08b99df8ff0e49a" signer.txt \
            || { echo "::error::The APK isn't signed with the usual key, so it wouldn't install over the app on the phone."; exit 1; }
          "$BT/aapt2" dump badging PhysioDesk.apk > badging.txt
          head -n 1 badging.txt
          grep -q "package: name='com.joseph.physiodesk'" badging.txt || { echo "::error::Wrong app id."; exit 1; }
          grep -q "versionCode='${{ github.run_number }}'" badging.txt \
            || { echo "::error::The build number didn't make it into the APK."; exit 1; }
          if grep -q "application-debuggable" badging.txt; then echo "::error::This is a debug build."; exit 1; fi

      - uses: actions/upload-artifact@v6
        with:
          name: PhysioDesk-apk
          path: PhysioDesk.apk
          retention-days: 30

      - name: Publish as a Release (direct download on the phone)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "physiodesk-build-${{ github.run_number }}" PhysioDesk.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "PhysioDesk build ${{ github.run_number }}" \
            --notes "Install PhysioDesk.apk on Android (allow installs from this source when asked)." \
            --latest
