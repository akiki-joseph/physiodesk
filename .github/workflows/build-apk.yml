name: Build Junctura APK

# Two versions of the same app:
#  direct  Junctura.apk from GitHub Releases, installed by hand. Sends reminder SMS by itself.
#  play    Junctura.aab for Google Play. Google only lets an app send SMS by itself if it is the
#          phone's SMS app, so this one leaves the SMS part out and reminds by notification
#          (tap it and WhatsApp opens with the message ready).
on:
  push:
    branches: [ main, 'claude/**' ]
    # Editing only the README doesn't need a new APK.
    paths-ignore:
      - '**.md'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        flavor: [direct, play]
    name: build (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    env:
      FLAVOR: ${{ matrix.flavor }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Native code and permissions
        run: |
          SRC=android/app/src/main
          J=$SRC/java/com/junctura/app
          M=$SRC/AndroidManifest.xml
          cp native/MainActivity.java native/PhysioCalendarPlugin.java $J/
          # calendar access (both versions)
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.READ_CALENDAR" />\n    <uses-permission android:name="android.permission.WRITE_CALENDAR" />\n</manifest>#' $M
          if [ "$FLAVOR" = direct ]; then
            # reminder SMS sent by the phone at the right time, also after a restart
            cp native/PhysioSmsPlugin.java native/SmsScheduler.java native/SmsAlarmReceiver.java native/SmsBootReceiver.java $J/
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.SEND_SMS" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />\n</manifest>#' $M
            sed -i 's#</application>#    <receiver android:name=".SmsAlarmReceiver" android:exported="false" />\n        <receiver android:name=".SmsBootReceiver" android:exported="false"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED" /></intent-filter></receiver>\n    </application>#' $M
            grep -q 'SmsAlarmReceiver' $M
          else
            # no SMS, and no exact alarms (the notification plugin asks for them; reminders may come a few minutes late)
            sed -i '/PhysioSmsPlugin/d' $J/MainActivity.java
            sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android"#<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools"#' $M
            sed -i 's#</manifest>#    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" tools:node="remove" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" tools:node="remove" />\n</manifest>#' $M
            if grep -q PhysioSms $J/MainActivity.java; then echo "::error::SMS code left in the Play version."; exit 1; fi
          fi
          # Links like junctura://auth/callback (from the confirmation email) open the app
          sed -i '0,/<\/activity>/s##            <intent-filter android:autoVerify="false">\n                <action android:name="android.intent.action.VIEW" />\n                <category android:name="android.intent.category.DEFAULT" />\n                <category android:name="android.intent.category.BROWSABLE" />\n                <data android:scheme="junctura" />\n            </intent-filter>\n        </activity>#' $M
          grep -q 'android:scheme="junctura"' $M
          grep -q 'PhysioCalendarPlugin' $J/MainActivity.java
          cat $M

      - name: App icon
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icons/$d.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp icons/$d.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
            cp icons/$d.png android/app/src/main/res/mipmap-$d/ic_launcher_foreground.png
          done
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Splash screen
        run: |
          for f in splash/*.png; do
            n=$(basename "$f" .png)
            cp "$f" "android/app/src/main/res/$n/splash.png"
          done

      - name: Build number (shows as "build N" in the phone's app info)
        run: |
          sed -i -E 's/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName "[^"]*"/versionName "build ${{ github.run_number }}"/' android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle
          grep -q "versionCode ${{ github.run_number }}" android/app/build.gradle

      # ---------- direct: Junctura.apk, signed with the key the installed app already has ----------
      - name: Signing key (the same key on every build, so updates install over the old app and keep its data)
        if: matrix.flavor == 'direct'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/app.keystore"
          elif [ -f keystore/debug.keystore ]; then
            cp keystore/debug.keystore "$RUNNER_TEMP/app.keystore"
          else
            echo "::error::No signing key. Put the keystore folder back, or add the KEYSTORE_BASE64 secret (see README)."
            exit 1
          fi

      - name: Build the APK
        if: matrix.flavor == 'direct'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/app.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
          cp app/build/outputs/apk/release/app-release.apk ../Junctura.apk

      - name: Check the APK (right key, right build number, Android 16 target, not a debug build)
        if: matrix.flavor == 'direct'
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BT/apksigner" verify --print-certs Junctura.apk | tee signer.txt
          grep -q "SHA-256 digest: 45fd01b3856bbdab1a5ee75b9f862ed4bb29690d912f3c9fc08b99df8ff0e49a" signer.txt \
            || { echo "::error::The APK isn't signed with the usual key, so it wouldn't install over the app on the phone."; exit 1; }
          "$BT/aapt2" dump badging Junctura.apk > badging.txt
          head -n 3 badging.txt
          grep -q "package: name='com.junctura.app'" badging.txt || { echo "::error::Wrong app id."; exit 1; }
          grep -q "versionCode='${{ github.run_number }}'" badging.txt \
            || { echo "::error::The build number didn't make it into the APK."; exit 1; }
          grep -q "targetSdkVersion:'36'" badging.txt || { echo "::error::The app doesn't target Android 16 (API 36)."; exit 1; }
          grep -q "SEND_SMS" badging.txt || { echo "::error::The direct version lost its SMS permission."; exit 1; }
          if grep -q "application-debuggable" badging.txt; then echo "::error::This is a debug build."; exit 1; fi

      - uses: actions/upload-artifact@v6
        if: matrix.flavor == 'direct'
        with:
          name: Junctura-apk
          path: Junctura.apk
          retention-days: 30

      - name: Publish as a Release (direct download on the phone)
        if: matrix.flavor == 'direct' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "junctura-build-${{ github.run_number }}" Junctura.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Junctura build ${{ github.run_number }}" \
            --notes "Install Junctura.apk on Android (allow installs from this source when asked)." \
            --latest

      # ---------- play: Junctura.aab for the Play Console, signed with the upload key ----------
      - name: Build the app bundle
        if: matrix.flavor == 'play'
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ] && [ -n "$UPLOAD_KEYSTORE_PASSWORD" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            ./gradlew bundleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.keystore" \
              -Pandroid.injected.signing.store.password="$UPLOAD_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias=upload \
              -Pandroid.injected.signing.key.password="$UPLOAD_KEYSTORE_PASSWORD"
            echo "SIGNED=yes" >> "$GITHUB_ENV"
          else
            echo "::notice::No upload key yet (UPLOAD_KEYSTORE_BASE64), so the bundle is built unsigned: fine for checking, not for the Play Console."
            ./gradlew bundleRelease --no-daemon
            echo "SIGNED=no" >> "$GITHUB_ENV"
          fi
          cp app/build/outputs/bundle/release/app-release.aab ../Junctura.aab

      - name: Check the bundle (no SMS, no exact alarms, Android 16 target)
        if: matrix.flavor == 'play'
        run: |
          curl -sSfL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle=Junctura.aab > manifest.xml
          cat manifest.xml
          grep -q 'package="com.junctura.app"' manifest.xml || { echo "::error::Wrong app id."; exit 1; }
          grep -q 'android:targetSdkVersion="36"' manifest.xml || { echo "::error::The app doesn't target Android 16 (API 36)."; exit 1; }
          grep -q 'android:versionCode="${{ github.run_number }}"' manifest.xml || { echo "::error::Wrong build number."; exit 1; }
          for p in SEND_SMS READ_SMS RECEIVE_SMS USE_EXACT_ALARM SCHEDULE_EXACT_ALARM; do
            if grep -q "android.permission.$p\"" manifest.xml; then echo "::error::The Play version asks for $p, which Google Play would refuse."; exit 1; fi
          done
          if grep -q 'android:debuggable="true"' manifest.xml; then echo "::error::This is a debug build."; exit 1; fi

      - uses: actions/upload-artifact@v6
        if: matrix.flavor == 'play'
        with:
          name: Junctura-play-aab-${{ env.SIGNED == 'yes' && 'signed' || 'unsigned' }}
          path: Junctura.aab
          retention-days: 30
